# OpenHive's OWN continuous integration.
# This is NOT the action shipped to maintainers — that template lives at
# templates/openhive-action.yml. Keeping them separate prevents the repo from
# becoming self-referential during testing.

name: OpenHive CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Import smoke test
        run: |
          python -c "import backend.main; print('OpenHive imports OK')"
